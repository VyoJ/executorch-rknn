x-common: &common
  platform: linux/amd64
  volumes:
    - ..:/work
  working_dir: /work
  network_mode: none

services:
  aot:
    <<: *common
    build:
      context: .
      dockerfile: aot.Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: executorch-rknn/aot:dev
    environment:
      PYTHONPATH: /work/backend/python

  cross:
    <<: *common
    build:
      context: .
      dockerfile: cross.Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: executorch-rknn/cross:dev
